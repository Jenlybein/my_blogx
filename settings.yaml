# 系统配置
system:
  ip:
  port: 8080
  env: dev

# 日志配置
log:
  app: blogx_server
  dir: ./logs

# 数据库配置
db:
  host: 127.0.0.1
  port: 3308
  user: root
  password: root
  dbname: blogx_db
  debug: false
  source: mysql

db1:
  host: 127.0.0.1
  port: 3308
  user: root
  password: root
  dbname: blogx_db
  debug: false
  source: mysql

# gorm 配置
gorm:
  max_idle_conns: 100 # 空闲连接池中连接的最大数量
  max_open_conns: 100 # 打开数据库连接的最大数量
  conn_max_lifetime: 1 # 可重新使用连接的最大时间(单位：小时)
