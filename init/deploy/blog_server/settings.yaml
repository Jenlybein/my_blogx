system:
  server_id: 1
  ip: ""
  port: ******_port1
  env: dev
  gin_mode: release
jwt:
  expire: 3600
  refresh_expire: 720
  secret: ******_secret1
  issuer: ******_issuer1
log:
  app: blogx_server
  dir: ./logs
  level: info
  stdout_format: json
  request_log_enabled: true
  query_default_limit: 20
  query_max_limit: 200
db:
  - host: mysql-master
    port: ******_port2
    user: admin
    password: ******_password1
    dbname: blogx
    source: mysql
  - host: mysql-slave
    port: ******_port2
    user: admin
    password: ******_password1
    dbname: blogx
    source: mysql
gorm:
  debug: true
  max_idle_conns: 100
  max_open_conns: 100
  conn_max_lifetime: 1
redis:
  addr: redis
  port: ******_port4
  username: default
  password: ******_password1
  db: 0
kafka:
  mysql:
    brokers:
      - ******_addr1:19092
    topic: blogx-mysql
    group_id: logistics_group
    username: logistics
    password: ******_password2
es:
  addresses:
    - http://es:9200
  username: elastic
  password: ******_password1
  index: article_index
  addr: es:9200
  is_https: false
clickhouse:
  enabled: true
  addresses:
    - clickhouse:9000
  database: blogx_logs
  username: default
  password: ******_password1
  dial_timeout: 5
  max_open_conns: 10
  max_idle_conns: 5
river:
  enabled: true
  server_id: 1001
  flavor: mysql
  data_dir: ./var
  mysql:
    addr: mysql-master:******_port2
    user: admin
    password: ******_password1
  source:
    - schema: blogx
      tables:
        - article_models
  rule:
    - schema: blogx
      table: article_models
      index: article_index
      type: _doc
      filter:
        - id
        - created_at
        - updated_at
        - title
        - abstract
        - category_id
        - cover
        - comments_toggle
  charset: "utf8mb4"
  mysqldump: "/usr/local/bin/mariadb-dump-wrapper"
  skip_master_data: true
  bulk_size: 128
  flush_bulk_time: 200
image_ref_river:
  enabled: true
  server_id: 1002
  flavor: mysql
  schema: blogx
  mysql:
    addr: mysql-master:******_port2
    user: admin
    password: ******_password1
  charset: "utf8mb4"
  mysqldump: "/usr/local/bin/mariadb-dump-wrapper"
  skip_master_data: true
upload:
  size: 3
  whitelist:
    - bmp
    - jpg
    - jpeg
    - png
    - gif
    - webp
  upload_dir: images001
email:
  domain: ******_domain1
  port: ******_port5
  send_email: ******_send_email1
  auth_code: REDACTED_SMTP_AUTH_CODE
  send_nickname: 我的博客
  ssl: false
  tls: false
qq:
  app_id: "123456"
  app_key: ""
  redirect: "123456"
qiniu:
  enable: true
  access_key: ******_access_key1
  secret_key: ******_secret_key1
  bucket: myblogx
  uri: "https://REDACTED_CDN_DOMAIN"
  region: z2
  prefix: myblogx
  size: 5
  expiry: 1800
  callback_url: ""
