version: "3.2"
services:
  mysql-master:
    image: "mysql:5.7"
    container_name: mysql-master
    restart: always
    privileged: true # 容器内的root用户与宿主机root用户权限相同
    environment:
      MYSQL_ROOT_PASSWORD: 123456 #主库root用户的密码
    command: --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
    ports:
      - 3306:3306 #映射宿主机端口：容器端口
    volumes: #宿主机配置目录或文件挂载到容器
      - ./sql_master/my.cnf:/etc/mysql/my.cnf
      - ./sql_master/mysql-files:/var/lib/mysql-files
      - ./sql_master/data:/var/lib/mysql
      - ./sql_master/log:/var/log/
    networks:
      blogx_network:
        ipv4_address: 10.2.0.2
  mysql-slave:
    image: "mysql:5.7"
    container_name: mysql-slave
    restart: always
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: 123456 #从库root用户的密码
    command: --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
    ports:
      - 3307:3306 #映射宿主机端口：容器端口
    volumes: #宿主机配置目录或文件挂载到容器
      - ./sql_slave/my.cnf:/etc/mysql/my.cnf
      - ./sql_slave/mysql-files:/var/lib/mysql-files
      - ./sql_slave/data:/var/lib/mysql
      - ./sql_slave/log:/var/log/
    networks:
      blogx_network:
        ipv4_address: 10.2.0.3
  es:
    image: "elasticsearch:7.12.0"
    restart: always
    privileged: true
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - 9200:9200
    volumes:
      - ./es/data:/usr/share/elasticsearch/data
    networks:
      blogx_network:
        ipv4_address: 10.2.0.4
  redis:
    image: "redis:7.4.7"
    container_name: redis
    restart: always
    privileged: true
    command: redis-server /etc/redis/redis.conf
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
      - ./redis/conf/redis.conf:/etc/redis/redis.conf
networks: #定义容器连接网络
  blogx_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.2.0.0/24
