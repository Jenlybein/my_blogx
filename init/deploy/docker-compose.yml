  blogx_server:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      TZ: "Asia/Shanghai" # 设置时区
      ES_WAIT_URL: "http://es:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
      ES_WAIT_AUTH_HEADER: "Authorization: Basic ZWxhc3RpYzpteWJsb2d4QWJjMTIzNDU="
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      es:
        condition: service_healthy
      redis:
        condition: service_healthy
      # kafka:
      #   condition: service_healthy
    volumes:
      - ./blog_server/settings.yaml:/app/settings.yaml
      - ./blog_server/site_default_settings.yaml:/app/site_default_settings.yaml
      - ./blog_server/uploads:/app/uploads
      - ./blog_server/logs:/app/logs
      - ./blog_server/var:/app/var
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/api/site/ai_info || exit 1",
        ]
      interval: 100s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      [
        "/bin/sh",
        "-c",
        "until wget -S -O /dev/null http://es:9200 2>&1 | grep -q '401 Unauthorized'; do echo '等待 ES 完整启动...'; sleep 3; done; exec /app/main",
      ]
    networks:
      blogx_network:
        ipv4_address: 10.2.0.7

  blog_web:
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx/
      - ./nginx/dist:/usr/share/nginx/fai_web
      - ./nginx/cert/:/usr/share/nginx/cert
    networks:
      blogx_network:
        ipv4_address: 10.2.0.8
    ports:
      - "80:80"
      - "443:443"

networks: # 定义容器连接网络
  blogx_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.2.0.0/24
