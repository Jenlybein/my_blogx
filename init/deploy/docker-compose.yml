  #     # 注意：
  #     # - listener 绑定用 0.0.0.0 监听所有网卡是最稳的做法（对外真实地址由 advertised.listeners 决定）
  #     - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093

  #     # 配置对外公告的监听器地址（客户端实际连接的地址）
  #     # 当客户端连接Kafka时，Kafka会返回此地址给客户端
  #     - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://REDACTED_SERVER_IP:19092,CONTROLLER://kafka:9093

  #     # 配置监听器的安全协议映射
  #     # 格式：监听器名称:协议类型
  #     # INTERNAL（容器内）：PLAINTEXT（无认证）
  #     # EXTERNAL（外部）：SASL_PLAINTEXT（有认证）
  #     # CONTROLLER（KRaft内部）：SASL_PLAINTEXT（KRaft controller 也启用认证 - 方案B）
  #     - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT

  #     # ===== 单节点必须把这些 replication/minISR 设成 1 =====
  #     # （否则 Kafka 默认可能是 3，会导致创建内部主题/事务相关功能异常）
  #     - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
  #     - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
  #     - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
  #     - KAFKA_DEFAULT_REPLICATION_FACTOR=1
  #     - KAFKA_MIN_INSYNC_REPLICAS=1

  #     # ===== 生产常见建议项（按需）=====
